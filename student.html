<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Студента — АШП</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .hidden { display: none; }
        .box {
            border: 1px dashed #000000;
            padding: 10px;
            margin-bottom: 20px;
            max-width: 600px;
        }
        .student-card {
            border: 2px solid #000000;
            padding: 12px;
            margin-bottom: 10px;
            max-width: 600px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Плашка для отображения P2P IP -->
<div id="my-p2p-ip" class="box" style="font-weight: bold; border-color: #000000;">ОПРЕДЕЛЕНИЕ P2P IP...</div>
    <h1>🧑‍🎓 ПАНЕЛЬ СТУДЕНТА (АШП)</h1>
    <hr>
    <!-- Сюда скрипт выведет имя преподавателя, группу и предмет -->
    <div id="student-meta" class="box">
        <p>Ожидание ссылки от преподавателя с данными сессии...</p>
    </div>

    <h3>ВЕДОМОСТЬ УСПЕВАЕМОСТИ</h3>
    
    <!-- Контейнер, куда JS будет динамически добавлять карточки студентов -->
    <div id="student-grades-box"></div>

    <p><a href="index.html">На главную</a></p>

        <!-- Подключаем скрипт определения IP -->
    <script src="stunconnect.js"></script>

    <!-- Открываем брутальный скрипт расшифровки оценок -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Читаем параметр p2p из адресной строки
            const urlParams = new URLSearchParams(window.location.search);
            const p2pData = urlParams.get('p2p');

            if (!p2pData) return; // Если зашли без ссылки, ничего не делаем

            try {
                // Расшифровываем Base64 в нормальный русский текст
                const decodedJSON = decodeURIComponent(escape(atob(p2pData)));
                const parsed = JSON.parse(decodedJSON);

                // Выводим данные о предмете и группе
                document.getElementById('student-meta').innerHTML = `
                    <p><strong>ПРЕПОДАВАТЕЛЬ:</strong> ${parsed.t}</p>
                    <p><strong>ГРУППА:</strong> ${parsed.g}</p>
                    <p><strong>ПРЕДМЕТ:</strong> ${parsed.s}</p> 
                `;
                                // ЧАСТЬ 3: Вывод карточек студентов с оценками и ДЗ
                const gradesBox = document.getElementById('student-grades-box');
                gradesBox.innerHTML = ''; // Очищаем заглушки

                parsed.d.forEach(student => {
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.innerHTML = `
                        <p><strong>СТУДЕНТ:</strong> ${student.n}</p>
                        <p><strong>ОЦЕНКИ:</strong> ${student.g || 'Нет оценок'}</p>
                        <p><strong>ДОМАШНЕЕ ЗАДАНИЕ:</strong> ${student.hw || 'Не задано'}</p>
                    `;
                    gradesBox.appendChild(card);
                });

            } catch (err) {
                console.error("Ошибка расшифровки P2P данных:", err);
                document.getElementById('student-meta').innerText = "Ошибка: не удалось прочитать данные ссылки.";
            }
        });
    </script>
</body>
</html>
