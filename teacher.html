<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Преподавателя</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        input, select, button {
            font-family: monospace;
            font-size: 14px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 8px;
            margin-bottom: 15px;
            display: block;
            width: 100%;
            max-width: 400px;
        }

                button {
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: auto;
        }
        button:hover { background: #f0f0f0; }
        button:active { background: #000000; color: #ffffff; }
        .hidden { display: none; }
        .share-box {
            border: 2px dashed #000000;
            padding: 15px;
            margin-top: 20px;
            max-width: 600px;
        }
        .share-url {
            word-break: break-all;
            font-weight: bold;
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #000000;
            margin: 10px 0;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <!-- Плашка для отображения P2P IP -->
<div id="my-p2p-ip" class="box" style="font-weight: bold; border-color: #000000;">ОПРЕДЕЛЕНИЕ P2P IP...</div>
    
    <h1>👨‍🏫 ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ (АШП)</h1>
    <hr>

    <div id="auth-screen" class="box">
        <h2>ЗАПОЛНИТЕ ДАННЫЕ СЕССИИ</h2>
        
        <p>СОКРАЩЕННОЕ ФИО (НАПРИМЕР: ОСК):</p>
        <input type="text" id="teacher-fio" maxlength="5">

        <p>ГРУППА (НАПРИМЕР: ИСП-31):</p>
        <input type="text" id="group-name">

        <p>ПРЕДМЕТ:</p>
        <input type="text" id="subject-name">

        <button id="btn-create">СОЗДАТЬ ВЕДОМОСТЬ</button>
    </div>

        <div id="journal-screen" class="hidden">
        <h2 id="journal-title">ЖУРНАЛ: ...</h2>
        
        <div class="share-box">
            <p><strong>ССЫЛКА ДЛЯ СТУДЕНТОВ:</strong></p>
            <div id="student-link" class="share-url">Ожидание...</div>
            <button id="btn-copy-link">СКОПИРОВАТЬ ССЫЛКУ</button>
        </div>
        <hr>

                <h3>ВЕДОМОСТЬ УСПЕВАЕМОСТИ</h3>
        
        <div id="grades-box">
            <!-- Первая брутальная строка ввода -->
            <div style="border: 1px solid #000; padding: 10px; margin-bottom: 10px;">
                <p>ФИО СТУДЕНТА:</p>
                <input type="text" class="student-name" placeholder="Иванов И.И.">
                
                <p>ОЦЕНКИ (ЧЕРЕЗ ПРОБЕЛ):</p>
                <input type="text" class="g1" placeholder="5 4 5" style="width: 100px;">
                
                <p>ДОМАШНЕЕ ЗАДАНИЕ:</p>
                <input type="text" class="homework" placeholder="Доделать лабу №3">
            </div>
        </div>

                <button id="btn-add-row">+ ДОБАВИТЬ СТУДЕНТА В СПИСОК</button>
        <button id="btn-generate-p2p" style="background: #000000; color: #ffffff;">⚡ СФОРМИРОВАТЬ ССЫЛКУ С ДАННЫМИ</button>
    </div>

    <p><a href="index.html">На главную</a></p>

    <script>
function packJournalToLink() {
    const fio = document.getElementById('teacher-fio').value.toUpperCase() || 'ОСК';
    const group = document.getElementById('group-name').value.toUpperCase() || 'ГРУППА';
    const subject = document.getElementById('subject-name').value || 'Предмет';
    
    const boxes = document.querySelectorAll('#grades-box > div');
    const studentsData = [];

    boxes.forEach(box => {
        const name = box.querySelector('.student-name').value.trim();
        if (name) {
            studentsData.push({
                n: name,
                g: box.querySelector('.g1').value.trim(),
                hw: box.querySelector('.homework').value.trim()
            });
        }
    });

    const payload = { t: fio, g: group, s: subject, d: studentsData };
    const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    
    const baseUrl = window.location.origin + window.location.pathname.replace('teacher.html', 'student.html');
    document.getElementById('student-link').innerText = `${baseUrl}?p2p=${base64Data}#student`;
}

    document.getElementById('btn-create').addEventListener('click', () => {
    const fio = document.getElementById('teacher-fio').value.toUpperCase();
    const group = document.getElementById('group-name').value.toUpperCase();
    const subject = document.getElementById('subject-name').value;

    if (!fio || !group || !subject) {
        alert('Заполните все поля!');
        return;
    }

    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('journal-screen').classList.remove('hidden');
    document.getElementById('journal-title').innerText = `ЖУРНАЛ: ${fio} | ГРУППА: ${group} | ПРЕДМЕТ: ${subject}`;

    packJournalToLink();
});

    document.getElementById('btn-add-row').addEventListener('click', () => {
    const gradesBox = document.getElementById('grades-box');
    const newBox = document.createElement('div');
    newBox.style.cssText = 'border: 1px solid #000; padding: 10px; margin-bottom: 10px;';
    newBox.innerHTML = `
        <p>ФИО СТУДЕНТА:</p>
        <input type="text" class="student-name" placeholder="Студент">
        <p>ОЦЕНКИ (ЧЕРЕЗ ПРОБЕЛ):</p>
        <input type="text" class="g1" style="width: 100px;">
        <p>ДОМАШНЕЕ ЗАДАНИЕ:</p>
        <input type="text" class="homework" placeholder="...">
    `;
    gradesBox.appendChild(newBox);
});

    document.getElementById('btn-generate-p2p').addEventListener('click', () => {
    packJournalToLink();
    alert('Ссылка обновлена!');
});

document.getElementById('btn-copy-link').addEventListener('click', () => {
    const linkText = document.getElementById('student-link').innerText;
    navigator.clipboard.writeText(linkText);
    alert('Ссылка скопирована!');
});
</script>
<script src="stunconnect.js"></script> <!-- ВСТАВИТЬ СТРОГО СЮДА -->
</body>
</html>
